server {
 listen 80;
 server_name _;
 root /usr/share/nginx/html;
 include /etc/nginx/mime.types;
 types { model/gltf-binary glb; }
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy strict-origin-when-cross-origin always;
 location = /health { default_type text/plain; return 200 "ok\n"; }
 location /api/part-notes {
  client_max_body_size 64k;
  proxy_pass http://intel-3d-studio-part-notes:8080;
  proxy_set_header Host $http_host;
  proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  add_header Cache-Control "no-store" always;
  add_header X-Content-Type-Options nosniff always;
 }
 location / { add_header Cache-Control "no-store, no-cache, max-age=0, must-revalidate" always; try_files $uri $uri/ =404; }
 location ~* \.(glb|png)$ { add_header Cache-Control "public, max-age=3600"; }
}
