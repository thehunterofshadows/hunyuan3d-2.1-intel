server {
 listen 80;
 server_name _;
 root /usr/share/nginx/html;
 include /etc/nginx/mime.types;
 types { model/gltf-binary glb; }
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy strict-origin-when-cross-origin always;
 location = /health { default_type text/plain; return 200 "ok\n"; }
 location / { add_header Cache-Control "no-cache, must-revalidate" always; try_files $uri $uri/ =404; }
 location ~* \.(glb|png)$ { add_header Cache-Control "public, max-age=3600"; }
}
